# =============================================================================
# AGENTICS-DEV-PLATFORM API SERVICE - CLOUD BUILD
# =============================================================================
# CI/CD pipeline for deploying the API Gateway service.
#
# Service: agentics-api
# Region: us-central1
# Classification: API GATEWAY (Layer 4)
#
# IMPORTANT: Deployed with --allow-unauthenticated because the application
# handles authentication itself via the apiKeyGate middleware.
# This is required so the CLI can reach POST /v1/cli/auth/sessions
# (the device-flow login entry point) without a GCP identity token.
#
# All other endpoints are protected by application-level auth that validates:
#   - Authorization: Bearer <supabase-jwt>
#   - Authorization: Bearer agentics_*  (API key)
#   - X-API-Key: agentics_sk_* | agentics_internal_*
#   - Authorization: Bearer <gcp-identity-token>
# =============================================================================

steps:
  # ---------------------------------------------------------------------------
  # Step 1: Build Docker image
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/agentics-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/agentics-api:latest'
      - '-f'
      - 'packages/api/Dockerfile'
      - '.'

  # ---------------------------------------------------------------------------
  # Step 2: Push to Container Registry
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/agentics-api:$COMMIT_SHA'
    waitFor:
      - 'build-image'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-latest'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/agentics-api:latest'
    waitFor:
      - 'build-image'

  # ---------------------------------------------------------------------------
  # Step 3: Deploy to Cloud Run
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'agentics-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/agentics-api:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--timeout'
      - '300'
      - '--concurrency'
      - '80'
      # Allow unauthenticated access — the app handles auth via apiKeyGate.
      # This is required so the CLI can call POST /v1/cli/auth/sessions
      # without a GCP identity token (the device-flow login entry point).
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'NODE_ENV=production,SERVICE_NAME=agentics-api,SERVICE_VERSION=$COMMIT_SHA'
      - '--set-secrets'
      - 'DATABASE_URL=DATABASE_URL:latest,SUPABASE_URL=SUPABASE_URL:latest,AGENTICS_PLATFORM_URL=AGENTICS_PLATFORM_URL:latest,STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest'
      - '--service-account'
      - 'agentics-api-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--labels'
      - 'app=agentics-api,environment=production,team=platform'
    waitFor:
      - 'push-image'

  # ---------------------------------------------------------------------------
  # Step 4: Verify deployment
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'verify-deployment'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Verifying deployment..."
        SERVICE_URL=$$(gcloud run services describe agentics-api --region=us-central1 --format='value(status.url)')
        echo "Service URL: $$SERVICE_URL"

        # Health check (public, no auth required)
        echo "Checking health endpoint..."
        curl -sf "$$SERVICE_URL/health" || exit 1

        # Ready check (public)
        echo "Checking ready endpoint..."
        curl -sf "$$SERVICE_URL/ready" || echo "Warning: ready check returned non-200"

        # Verify POST /v1/cli/auth/sessions is reachable (should return 201 or 400, not 403)
        echo "Checking CLI auth session endpoint accessibility..."
        HTTP_CODE=$$(curl -s -o /dev/null -w "%{http_code}" \
          -X POST "$$SERVICE_URL/v1/cli/auth/sessions" \
          -H "Content-Type: application/json" \
          -d '{}')
        if [ "$$HTTP_CODE" = "403" ]; then
          echo "ERROR: CLI auth endpoint still returning 403 — check --allow-unauthenticated"
          exit 1
        fi
        echo "CLI auth endpoint returned HTTP $$HTTP_CODE (expected 201 or 500 depending on DB)"

        # Verify protected endpoint returns 401 without credentials (not 403 from IAM)
        echo "Checking that protected endpoints require app-level auth..."
        HTTP_CODE=$$(curl -s -o /dev/null -w "%{http_code}" "$$SERVICE_URL/v1/auth/session")
        if [ "$$HTTP_CODE" != "401" ]; then
          echo "WARNING: Protected endpoint returned $$HTTP_CODE instead of 401"
        else
          echo "Protected endpoint correctly returns 401 without credentials"
        fi

        echo ""
        echo "Deployment verification complete!"
    waitFor:
      - 'deploy-cloud-run'

# Container images to push
images:
  - 'gcr.io/$PROJECT_ID/agentics-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/agentics-api:latest'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# Timeout for entire build
timeout: '1200s'
