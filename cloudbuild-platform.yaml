# Existing project only. Configure _STAGING_VALIDATION_RUN after the same source
# revision passes Stack Staging Validation in the protected staging environment.
# No automatic trigger or production deployment is created by this file.
steps:
  - name: 'node:24.22.1'
    id: 'validate-source'
    entrypoint: 'bash'
    args: ['scripts/verify-platform-ci.sh']
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/agentics-platform:$COMMIT_SHA', '-f', 'Dockerfile', '.']
    waitFor: ['validate-source']
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args: ['push', 'gcr.io/$PROJECT_ID/agentics-platform:$COMMIT_SHA']
    waitFor: ['build-image']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'verified-release'
    entrypoint: 'bash'
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'SOURCE_COMMIT=$COMMIT_SHA'
      - 'STAGING_RUN_ID=${_STAGING_VALIDATION_RUN}'
    args: ['scripts/deploy-platform-release.sh']
    waitFor: ['push-image']
substitutions:
  _STAGING_VALIDATION_RUN: ''
images:
  - 'gcr.io/$PROJECT_ID/agentics-platform:$COMMIT_SHA'
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
timeout: '1800s'
