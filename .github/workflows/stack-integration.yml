name: Stack Integration
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stack-integration-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  platform-ci:
    name: Platform Build and Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.22.1"
          cache: npm
      - name: Deterministic builds, integration regressions, contracts and security
        run: bash scripts/verify-platform-ci.sh
