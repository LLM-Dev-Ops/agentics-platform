name: Architecture Enforcement
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
concurrency:
  group: architecture-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  validate-dependencies:
    name: Validate Dependency Graph Compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.22.1"
      - name: Validate the supplied fleet composition and negative controls
        run: node --test ci/stack/*.test.mts
      - name: Enforce existing canonical runtime-layer and import rules
        run: bash ci/check-architecture.sh
