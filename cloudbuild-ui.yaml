steps:
  # Build the UI Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/agentics-ui:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/agentics-ui:latest'
      - '-f'
      - 'packages/ui/Dockerfile'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=https://erp-surface-1062287243982.us-central1.run.app'
      - '.'

  # Push the image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/agentics-ui:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/agentics-ui:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'agentics-ui'
      - '--image'
      - 'gcr.io/$PROJECT_ID/agentics-ui:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'

images:
  - 'gcr.io/$PROJECT_ID/agentics-ui:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/agentics-ui:latest'

options:
  logging: CLOUD_LOGGING_ONLY
