steps:
  # Build the UI Docker image
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    secretEnv:
      - 'NEXT_PUBLIC_SUPABASE_URL'
      - 'NEXT_PUBLIC_SUPABASE_ANON_KEY'
    args:
      - '-c'
      - |
        docker build \
          -t gcr.io/$PROJECT_ID/agentics-ui:$COMMIT_SHA \
          -t gcr.io/$PROJECT_ID/agentics-ui:latest \
          -f packages/ui/Dockerfile \
          --build-arg NEXT_PUBLIC_API_URL=https://platform.agentics.dev \
          --build-arg NEXT_PUBLIC_SUPABASE_URL="$$NEXT_PUBLIC_SUPABASE_URL" \
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
          .

  # Push the image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/agentics-ui:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/agentics-ui:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'agentics-ui'
      - '--image'
      - 'gcr.io/$PROJECT_ID/agentics-ui:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'

images:
  - 'gcr.io/$PROJECT_ID/agentics-ui:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/agentics-ui:latest'

availableSecrets:
  secretManager:
    - versionName: 'projects/$PROJECT_ID/secrets/NEXT_PUBLIC_SUPABASE_URL/versions/latest'
      env: 'NEXT_PUBLIC_SUPABASE_URL'
    - versionName: 'projects/$PROJECT_ID/secrets/NEXT_PUBLIC_SUPABASE_ANON_KEY/versions/latest'
      env: 'NEXT_PUBLIC_SUPABASE_ANON_KEY'

options:
  logging: CLOUD_LOGGING_ONLY
