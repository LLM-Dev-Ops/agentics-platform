# =============================================================================
# AGENTICS-DEV-PLATFORM AGENTS SERVICE - CLOUD BUILD
# =============================================================================
# CI/CD pipeline for deploying the unified agents control-plane service.
#
# Service: agentics-agents
# Region: us-central1
# Classification: EXECUTIVE DECISIONING, SYNTHESIS, PLATFORM GOVERNANCE
#
# AGENTS EXPOSED:
# - Decision Agent (/decision/*)
# - Executive Summary Agent (/executive-summary/*)
# - Risk Scoring Agent (/risk-scoring/*)
# =============================================================================

steps:
  # ---------------------------------------------------------------------------
  # Step 1: Build Docker image
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/agentics-agents:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/agentics-agents:latest'
      - '-f'
      - 'packages/agents/Dockerfile'
      - '.'

  # ---------------------------------------------------------------------------
  # Step 2: Push to Container Registry
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/agentics-agents:$COMMIT_SHA'
    waitFor:
      - 'build-image'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-latest'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/agentics-agents:latest'
    waitFor:
      - 'build-image'

  # ---------------------------------------------------------------------------
  # Step 3: Deploy to Cloud Run
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'agentics-agents'
      - '--image'
      - 'gcr.io/$PROJECT_ID/agentics-agents:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--timeout'
      - '300'
      - '--concurrency'
      - '80'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'NODE_ENV=production,SERVICE_NAME=agentics-agents,SERVICE_VERSION=$COMMIT_SHA'
      - '--set-secrets'
      - 'RUVECTOR_SERVICE_URL=RUVECTOR_SERVICE_URL:latest,RUVECTOR_API_KEY=ruvector-auth-token:latest,TELEMETRY_ENDPOINT=TELEMETRY_ENDPOINT:latest,PLATFORM_ENV=platform-env:latest'
      - '--service-account'
      - 'agentics-agents-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--labels'
      - 'app=agentics-agents,environment=production,team=platform'
    waitFor:
      - 'push-image'

  # ---------------------------------------------------------------------------
  # Step 4: Verify deployment
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'verify-deployment'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Verifying deployment..."
        SERVICE_URL=$$(gcloud run services describe agentics-agents --region=us-central1 --format='value(status.url)')
        echo "Service URL: $$SERVICE_URL"

        # Health check
        echo "Checking health endpoint..."
        curl -sf "$$SERVICE_URL/health" || exit 1

        # Ready check
        echo "Checking ready endpoint..."
        curl -sf "$$SERVICE_URL/ready" || echo "Warning: ready check returned non-200"

        # List agents
        echo "Listing registered agents..."
        curl -sf "$$SERVICE_URL/agents" | head -c 500

        echo ""
        echo "Deployment verification complete!"
    waitFor:
      - 'deploy-cloud-run'

# Container images to push
images:
  - 'gcr.io/$PROJECT_ID/agentics-agents:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/agentics-agents:latest'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# Timeout for entire build
timeout: '1200s'
